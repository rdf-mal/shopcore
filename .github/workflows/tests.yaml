name: Python-Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Python einrichten
        run: uv python install 3.13
      - name: Projekt installieren
        run: uv sync --dev
      - name: Tests ausführen
        run: uv run pytest